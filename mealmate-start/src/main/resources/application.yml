spring:
  application:
    name: mealmate-service
  profiles:
    active: local
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# AI 配置
mealmate:
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-v4-flash
      timeout-seconds: 30
      max-tokens: 4096
      temperature: 0.7

# AccessLogFilter 禁用：它使用 ContentCachingResponseWrapper 会阻断 SSE 异步流式响应。
# 项目 access log 由 WebInterceptor.afterCompletion 提供。
mimir:
  boot:
    log:
      access:
        enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
