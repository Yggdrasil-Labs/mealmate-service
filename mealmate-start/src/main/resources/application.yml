spring:
  application:
    name: mealmate-service
  profiles:
    active: local

# AI 配置
mealmate:
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-v4-flash
      timeout-seconds: 30
      max-tokens: 4096
      temperature: 0.7

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
